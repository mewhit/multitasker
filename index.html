<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
    <title>Multitasker</title>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      :root {
        --bg:       #0d1117;
        --bg2:      #161b22;
        --bg3:      #21262d;
        --border:   #30363d;
        --text:     #c9d1d9;
        --text-dim: #8b949e;
        --green:    #3fb950;
        --yellow:   #d29922;
        --red:      #f85149;
        --gray:     #484f58;
        --accent:   #58a6ff;
        --sidebar-w: 280px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      #header h1 { font-size: 14px; font-weight: 600; flex: 1; }
      #header h1 span { color: var(--accent); }
      .btn {
        background: var(--bg3);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 12px;
        transition: background 0.15s;
      }
      .btn:hover { background: #30363d; }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
      .btn-primary:hover { background: #79b8ff; }
      #layout { display: flex; flex: 1; overflow: hidden; }
      #sidebar {
        width: var(--sidebar-w);
        min-width: var(--sidebar-w);
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #sidebar-header {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #sidebar-header span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); }
      #session-list { flex: 1; overflow-y: auto; padding: 6px; }
      .session-card {
        border-radius: 8px;
        padding: 10px 10px 8px;
        margin-bottom: 4px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background 0.1s;
      }
      .session-card:hover { background: var(--bg3); }
      .session-card.active { background: var(--bg3); border-color: var(--accent); }
      .session-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      .status-dot.waiting { background: var(--green); box-shadow: 0 0 6px var(--green); }
      .status-dot.running { background: var(--yellow); animation: pulse 1.5s infinite; }
      .status-dot.error   { background: var(--red); }
      .status-dot.stopped { background: var(--gray); }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
      .session-name { font-weight: 600; font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .session-cwd { font-size: 11px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 6px; }
      .session-actions { display: flex; gap: 4px; }
      .btn-xs {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 4px;
        padding: 2px 6px;
        cursor: pointer;
        font-size: 11px;
      }
      .btn-xs:hover { background: var(--bg); color: var(--text); }
      .btn-xs.review { border-color: var(--green); color: var(--green); }
      .btn-xs.review:hover { background: rgba(63,185,80,0.1); }
      .btn-xs.kill { border-color: var(--red); color: var(--red); }
      .btn-xs.kill:hover { background: rgba(248,81,73,0.1); }
      .waiting-badge {
        font-size: 10px; background: var(--green); color: #000;
        border-radius: 3px; padding: 1px 4px; font-weight: 700;
      }
      #empty-state { padding: 24px 16px; text-align: center; color: var(--text-dim); font-size: 12px; line-height: 1.6; }
      #empty-state .empty-icon { font-size: 28px; margin-bottom: 8px; }
      #terminal-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      #terminal-header {
        padding: 8px 14px;
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center; gap: 8px;
        flex-shrink: 0; min-height: 40px;
      }
      #terminal-title { font-size: 13px; font-weight: 600; flex: 1; }
      #terminal-cwd { font-size: 11px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }
      #terminal-wrap { flex: 1; padding: 4px; overflow: hidden; position: relative; background: #0d1117; }
      .xterm-container { position: absolute; inset: 4px; }
      #no-session-msg {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: var(--text-dim); gap: 10px;
      }
      #no-session-msg .big-icon { font-size: 48px; }
      .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.6);
        display: flex; align-items: center; justify-content: center;
        z-index: 100; backdrop-filter: blur(2px);
      }
      .modal-overlay.hidden { display: none; }
      .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 440px; max-width: 95vw; }
      .modal h2 { font-size: 16px; margin-bottom: 18px; }
      .form-group { margin-bottom: 14px; }
      .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
      .form-group input {
        width: 100%; background: var(--bg3); border: 1px solid var(--border);
        border-radius: 6px; padding: 7px 10px; color: var(--text); font-size: 13px; outline: none;
      }
      .form-group input:focus { border-color: var(--accent); }
      .shell-selector { display: flex; gap: 4px; }
      .shell-btn {
        background: var(--bg3);
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 6px;
        padding: 5px 14px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.15s;
      }
      .shell-btn:hover { background: #30363d; color: var(--text); }
      .shell-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
      .shell-badge {
        font-size: 10px; border-radius: 3px; padding: 1px 5px; font-weight: 600;
        background: var(--bg); border: 1px solid var(--border); color: var(--text-dim);
        text-transform: uppercase; letter-spacing: 0.3px;
      }
      .shell-badge.ssh { border-color: var(--accent); color: var(--accent); }
      .form-row { display: flex; gap: 6px; }
      .form-row input { flex: 1; }
      .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="header">
      <h1>&#9889; <span>Multitasker</span></h1>
      <button class="btn btn-primary" id="btn-new">+ New Session</button>
      <button class="btn" id="btn-settings">&#9881; Settings</button>
    </div>

    <div id="layout">
      <div id="sidebar">
        <div id="sidebar-header">
          <span>Sessions</span>
          <span id="waiting-count" style="display:none; color:var(--green); font-weight:700; font-size:12px;"></span>
        </div>
        <div id="session-list">
          <div id="empty-state">
            <div class="empty-icon">&#129302;</div>
            <p>No sessions yet.<br>Click <strong>+ New Session</strong> to start<br>an AI CLI (claude, codex, etc.)</p>
          </div>
        </div>
      </div>

      <div id="terminal-area">
        <div id="terminal-header">
          <span id="terminal-title" style="color:var(--text-dim)">No session selected</span>
          <span id="terminal-cwd"></span>
          <button class="btn-xs review" id="btn-review-active" style="display:none">&#128194; Review Changes</button>
          <button class="btn-xs kill"   id="btn-kill-active"   style="display:none">&#10005; Kill</button>
        </div>
        <div id="terminal-wrap">
          <div id="no-session-msg">
            <span class="big-icon">&#128187;</span>
            <p>Select or create a session to begin</p>
          </div>
        </div>
      </div>
    </div>

    <!-- New Session Modal -->
    <div class="modal-overlay hidden" id="new-session-modal">
      <div class="modal">
        <h2>New AI Session</h2>
        <div class="form-group">
          <label>Session name</label>
          <input id="input-name" type="text" placeholder="e.g. Project Alpha" />
        </div>
        <div class="form-group">
          <label>Shell</label>
          <div class="shell-selector" id="new-shell-selector">
            <button class="shell-btn" data-shell="powershell">PowerShell</button>
            <button class="shell-btn" data-shell="bash">Bash</button>
            <button class="shell-btn" data-shell="ssh">SSH</button>
          </div>
        </div>
        <div class="form-group" id="ssh-host-group" style="display:none">
          <label>SSH Host</label>
          <input id="input-ssh-host" type="text" placeholder="user@hostname" />
        </div>
        <div class="form-group">
          <label>Command to run (AI CLI)</label>
          <input id="input-cmd" type="text" placeholder="e.g. claude, codex" />
        </div>
        <div class="form-group" id="cwd-group">
          <label>Working directory</label>
          <div class="form-row">
            <input id="input-cwd" type="text" placeholder="C:\Projects\my-app" />
            <button class="btn" id="btn-pick-dir">Browse</button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" id="btn-cancel-new">Cancel</button>
          <button class="btn btn-primary" id="btn-confirm-new">Launch</button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay hidden" id="settings-modal">
      <div class="modal">
        <h2>&#9881; Settings</h2>
        <div class="form-group">
          <label>Review tool command <em style="color:var(--text-dim)">(use {path})</em></label>
          <input id="settings-review-tool" type="text" placeholder="code {path}" />
        </div>
        <div class="form-group">
          <label>Default shell</label>
          <div class="shell-selector" id="settings-shell-selector">
            <button class="shell-btn" data-shell="powershell">PowerShell</button>
            <button class="shell-btn" data-shell="bash">Bash</button>
          </div>
        </div>
        <div class="form-group">
          <label>Idle timeout (ms)  time after last output to mark as "waiting"</label>
          <input id="settings-idle-timeout" type="number" min="200" max="5000" step="100" />
        </div>
        <div class="modal-footer">
          <button class="btn" id="btn-cancel-settings">Cancel</button>
          <button class="btn btn-primary" id="btn-save-settings">Save</button>
        </div>
      </div>
    </div>

    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script>
      const api = window.electronAPI;
      const terminals = {};
      let sessions = [];
      let activeId = null;
      let newShellType = 'powershell';

      // Shell selector helper
      function initShellSelector(containerId, onChange) {
        const container = document.getElementById(containerId);
        container.querySelectorAll('.shell-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            container.querySelectorAll('.shell-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            onChange(btn.dataset.shell);
          });
        });
      }

      function setShellSelector(containerId, shell) {
        const container = document.getElementById(containerId);
        container.querySelectorAll('.shell-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.shell === shell);
        });
      }

      api.getSessions().then(list => renderSidebar(list));
      api.onListUpdate(list => {
        sessions = list;
        renderSidebar(list);
        updateWaitingCount(list);
        if (activeId) refreshHeader(activeId);
      });
      api.onOutput((id, data) => {
        if (terminals[id]) terminals[id].term.write(data);
      });

      function renderSidebar(list) {
        const container = document.getElementById('session-list');
        const empty = document.getElementById('empty-state');
        if (list.length === 0) {
          empty.style.display = '';
          container.querySelectorAll('.session-card').forEach(el => el.remove());
          return;
        }
        empty.style.display = 'none';
        const existing = {};
        container.querySelectorAll('.session-card').forEach(el => { existing[el.dataset.id] = el; });
        Object.keys(existing).forEach(id => { if (!list.find(s => s.id === id)) existing[id].remove(); });
        list.forEach((s, i) => {
          let card = existing[s.id];
          if (!card) { card = createCard(s); container.appendChild(card); }
          else updateCard(card, s);
          const nodes = container.querySelectorAll('.session-card');
          if (nodes[i] !== card) container.insertBefore(card, nodes[i] || null);
          card.classList.toggle('active', s.id === activeId);
        });
      }

      function createCard(s) {
        const card = document.createElement('div');
        card.className = 'session-card';
        card.dataset.id = s.id;
        card.innerHTML = cardHTML(s);
        card.addEventListener('click', () => activateSession(s.id));
        attachCardButtons(card, s);
        ensureTerminal(s.id);
        return card;
      }

      function updateCard(card, s) {
        card.innerHTML = cardHTML(s);
        attachCardButtons(card, s);
      }

      function attachCardButtons(card, s) {
        const rev = card.querySelector('.btn-xs.review');
        if (rev) rev.addEventListener('click', e => { e.stopPropagation(); api.openReview(s.cwd); });
        card.querySelector('.btn-xs.kill').addEventListener('click', e => {
          e.stopPropagation();
          api.killSession(s.id).then(() => cleanupTerminal(s.id));
        });
      }

      function cardHTML(s) {
        const shortCwd = s.cwd.length > 32 ? '...' + s.cwd.slice(-30) : s.cwd;
        const waitBadge = s.status === 'waiting' ? '<span class="waiting-badge">WAITING</span>' : '';
        const reviewBtn = s.gitChanges ? '<button class="btn-xs review">&#128194; Changes</button>' : '';
        const shellLabel = s.shellType === 'ssh' ? s.sshHost || 'ssh' : s.shellType;
        const shellBadge = '<span class="shell-badge' + (s.shellType === 'ssh' ? ' ssh' : '') + '">' + esc(shellLabel) + '</span>';
        const cwdLine = s.shellType === 'ssh' ? '' : '<div class="session-cwd" title="' + esc(s.cwd) + '">' + esc(shortCwd) + '</div>';
        return '<div class="session-card-top"><span class="status-dot ' + s.status + '"></span><span class="session-name">' + esc(s.name) + '</span>' + waitBadge + shellBadge + '</div>' + cwdLine + '<div class="session-actions">' + reviewBtn + '<button class="btn-xs kill">&#10005; Kill</button></div>';
      }

      function updateWaitingCount(list) {
        const n = list.filter(s => s.status === 'waiting').length;
        const el = document.getElementById('waiting-count');
        if (n > 0) { el.textContent = n + ' waiting'; el.style.display = ''; }
        else el.style.display = 'none';
      }

      function ensureTerminal(id) {
        if (terminals[id]) return;
        const wrap = document.getElementById('terminal-wrap');
        const el = document.createElement('div');
        el.className = 'xterm-container';
        el.style.display = 'none';
        wrap.appendChild(el);
        const term = new Terminal({
          theme: {
            background: '#0d1117', foreground: '#c9d1d9', cursor: '#58a6ff',
            black: '#484f58', red: '#f85149', green: '#3fb950', yellow: '#d29922',
            blue: '#58a6ff', magenta: '#bc8cff', cyan: '#39c5cf', white: '#b1bac4',
            brightBlack: '#6e7681', brightRed: '#ff7b72', brightGreen: '#56d364',
            brightYellow: '#e3b341', brightBlue: '#79c0ff', brightMagenta: '#d2a8ff',
            brightCyan: '#56d4dd', brightWhite: '#f0f6fc',
          },
          fontFamily: '"Cascadia Code", "Fira Code", Consolas, monospace',
          fontSize: 13, lineHeight: 1.3, cursorBlink: true,
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(el);
        fitAddon.fit();
        term.onData(data => api.sendInput(id, data));
        term.onResize(({ cols, rows }) => api.resizeSession(id, cols, rows));
        terminals[id] = { term, fitAddon, el };
      }

      function activateSession(id) {
        if (activeId === id) return;
        if (activeId && terminals[activeId]) terminals[activeId].el.style.display = 'none';
        activeId = id;
        const t = terminals[id];
        if (t) {
          t.el.style.display = '';
          requestAnimationFrame(() => { t.fitAddon.fit(); t.term.focus(); });
        }
        document.getElementById('no-session-msg').style.display = 'none';
        document.querySelectorAll('.session-card').forEach(el => el.classList.toggle('active', el.dataset.id === id));
        refreshHeader(id);
      }

      function refreshHeader(id) {
        const s = sessions.find(x => x.id === id);
        if (!s) return;
        const title = document.getElementById('terminal-title');
        title.textContent = s.name; title.style.color = '';
        document.getElementById('terminal-cwd').textContent = s.cwd;
        document.getElementById('btn-review-active').style.display = s.gitChanges ? '' : 'none';
        document.getElementById('btn-kill-active').style.display = '';
      }

      function cleanupTerminal(id) {
        const t = terminals[id];
        if (t) { t.term.dispose(); t.el.remove(); delete terminals[id]; }
        if (activeId === id) {
          activeId = null;
          const title = document.getElementById('terminal-title');
          title.textContent = 'No session selected'; title.style.color = 'var(--text-dim)';
          document.getElementById('terminal-cwd').textContent = '';
          document.getElementById('btn-review-active').style.display = 'none';
          document.getElementById('btn-kill-active').style.display = 'none';
          document.getElementById('no-session-msg').style.display = '';
        }
      }

      window.addEventListener('resize', () => {
        if (activeId && terminals[activeId]) terminals[activeId].fitAddon.fit();
      });

      document.getElementById('btn-review-active').addEventListener('click', () => {
        const s = sessions.find(x => x.id === activeId);
        if (s) api.openReview(s.cwd);
      });
      document.getElementById('btn-kill-active').addEventListener('click', () => {
        if (activeId) api.killSession(activeId).then(() => cleanupTerminal(activeId));
      });

      document.getElementById('btn-new').addEventListener('click', async () => {
        const s = await api.getSettings();
        newShellType = s.defaultShell || 'powershell';
        document.getElementById('input-name').value = '';
        document.getElementById('input-cmd').value = '';
        document.getElementById('input-cwd').value = '';
        document.getElementById('input-ssh-host').value = '';
        setShellSelector('new-shell-selector', newShellType);
        document.getElementById('ssh-host-group').style.display = newShellType === 'ssh' ? '' : 'none';
        document.getElementById('cwd-group').style.display = newShellType === 'ssh' ? 'none' : '';
        document.getElementById('new-session-modal').classList.remove('hidden');
        setTimeout(() => document.getElementById('input-name').focus(), 50);
      });
      document.getElementById('btn-cancel-new').addEventListener('click', () => {
        document.getElementById('new-session-modal').classList.add('hidden');
      });
      document.getElementById('btn-pick-dir').addEventListener('click', async () => {
        const dir = await api.pickDirectory();
        if (dir) document.getElementById('input-cwd').value = dir;
      });
      document.getElementById('btn-confirm-new').addEventListener('click', async () => {
        const name    = document.getElementById('input-name').value.trim();
        const cmd     = document.getElementById('input-cmd').value.trim();
        const cwd     = document.getElementById('input-cwd').value.trim();
        const sshHost = document.getElementById('input-ssh-host').value.trim();
        if (!name) { alert('Session name is required.'); return; }
        if (newShellType === 'ssh' && !sshHost) { alert('SSH host is required.'); return; }
        if (newShellType !== 'ssh' && !cwd) { alert('Working directory is required.'); return; }
        document.getElementById('new-session-modal').classList.add('hidden');
        const id = await api.createSession(name, cmd, cwd, newShellType, sshHost);
        ensureTerminal(id);
        activateSession(id);
      });
      document.getElementById('input-cwd').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('btn-confirm-new').click();
      });

      document.getElementById('btn-settings').addEventListener('click', async () => {
        const s = await api.getSettings();
        document.getElementById('settings-review-tool').value = s.reviewTool;
        document.getElementById('settings-idle-timeout').value = String(s.idleTimeout);
        setShellSelector('settings-shell-selector', s.defaultShell || 'powershell');
        document.getElementById('settings-modal').classList.remove('hidden');
      });
      document.getElementById('btn-cancel-settings').addEventListener('click', () => {
        document.getElementById('settings-modal').classList.add('hidden');
      });
      document.getElementById('btn-save-settings').addEventListener('click', async () => {
        const reviewTool  = document.getElementById('settings-review-tool').value.trim();
        const idleTimeout = parseInt(document.getElementById('settings-idle-timeout').value, 10);
        const activeShellBtn = document.querySelector('#settings-shell-selector .shell-btn.active');
        const defaultShell = activeShellBtn ? activeShellBtn.dataset.shell : 'powershell';
        await api.setSettings({ reviewTool: reviewTool || 'code {path}', idleTimeout: idleTimeout || 800, defaultShell });
        document.getElementById('settings-modal').classList.add('hidden');
      });

      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.add('hidden'); });
      });

      // Init shell selectors
      initShellSelector('new-shell-selector', shell => {
        newShellType = shell;
        document.getElementById('ssh-host-group').style.display = shell === 'ssh' ? '' : 'none';
        document.getElementById('cwd-group').style.display = shell === 'ssh' ? 'none' : '';
      });
      initShellSelector('settings-shell-selector', () => {});

      function esc(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
    </script>
  </body>
</html>
